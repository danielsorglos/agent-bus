<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1526">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>sorgl.OS · Team</title>
<style>
  /* App-Blau nach sorgl.OS-CSS. Lila bleibt der Website vorbehalten. */
  :root{
    --bg:#0a1526; --karte:#0f1c31; --gehoben:#162641; --linie:#24375a;
    --text:#eaf1fb; --muted:#95a9c8; --akzent:#2f86e0; --akzent-hell:#4a9ad9;
    --gruen:#3fb27f; --gelb:#d9a441; --rot:#d9615a;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button,input,textarea,select{font:inherit; color:inherit}

  /* ---------------------------------------------------------------- Kopf */
  header{
    display:flex; align-items:center; gap:18px; padding:12px 20px;
    background:var(--karte); border-bottom:1px solid var(--linie); flex:none;
  }
  .marke{display:flex; align-items:baseline; gap:9px; font-weight:600; letter-spacing:.2px}
  .marke .punkt{color:var(--akzent)}
  .marke small{color:var(--muted); font-weight:400; letter-spacing:.08em; text-transform:uppercase; font-size:11px}
  .praesenz{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end}
  .chip{
    display:flex; align-items:center; gap:7px; padding:4px 11px 4px 7px;
    background:var(--gehoben); border:1px solid var(--linie); border-radius:999px;
    font-size:12px; white-space:nowrap;
  }
  .chip .punktlicht{width:7px; height:7px; border-radius:50%; background:var(--linie); flex:none}
  .chip.an .punktlicht{background:var(--gruen); box-shadow:0 0 0 3px rgba(63,178,127,.16)}
  .chip .wann{color:var(--muted)}
  .chip.mensch{border-style:dashed}

  /* --------------------------------------------------------------- Reiter */
  nav{display:flex; gap:2px; padding:0 20px; background:var(--karte); border-bottom:1px solid var(--linie); flex:none}
  nav button{
    background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
    padding:11px 16px; color:var(--muted); font-weight:500;
  }
  nav button:hover{color:var(--text)}
  nav button.aktiv{color:var(--text); border-bottom-color:var(--akzent)}
  nav .zaehler{
    display:inline-block; min-width:18px; margin-left:7px; padding:0 5px;
    background:var(--akzent); color:#fff; border-radius:9px; font-size:11px;
    font-weight:600; text-align:center;
  }

  main{flex:1; overflow:hidden; display:flex}
  .blatt{flex:1; display:none; overflow:hidden}
  .blatt.aktiv{display:flex}

  /* ---------------------------------------------------------------- Heute */
  #heute{flex-direction:column}
  .heutefluss{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:12px; max-width:920px}
  .abschnittskopf{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    margin:8px 0 2px; display:flex; align-items:center; gap:9px;
  }
  .abschnittskopf .anzahl{color:var(--text); font-weight:700}
  .fkarte{
    background:var(--karte); border:1px solid var(--linie); border-radius:var(--radius);
    padding:15px 17px;
  }
  .fkopf{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px}
  .fkopf .wer{font-weight:600}
  .fkopf .meta{color:var(--muted); font-size:12px}
  .stufe{
    margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.04em;
    border-radius:6px; padding:2px 9px;
  }
  .stufe.hoch{background:rgba(217,97,90,.16); color:var(--rot)}
  .stufe.mittel{background:rgba(217,164,65,.16); color:var(--gelb)}
  .stufe.niedrig{background:rgba(63,178,127,.14); color:var(--gruen)}
  .fwarum{margin:2px 0 10px; white-space:pre-wrap; overflow-wrap:anywhere}
  .fvorschau{
    font:12.5px/1.5 ui-monospace,Consolas,monospace; background:var(--bg);
    border:1px solid var(--linie); border-radius:9px; padding:11px 13px;
    margin:0 0 12px; overflow-x:auto; white-space:pre; max-height:260px; overflow-y:auto;
  }
  .fzeile{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .fzeile input{
    flex:1; min-width:180px; background:var(--gehoben); border:1px solid var(--linie);
    border-radius:9px; padding:9px 12px;
  }
  .fzeile input:focus{outline:none; border-color:var(--akzent)}
  .knopf.gruen{background:var(--gruen); border-color:var(--gruen)}
  .knopf.gruen:hover{filter:brightness(1.1)}
  .knopf.rot{background:none; border-color:var(--rot); color:var(--rot)}
  .knopf.rot:hover{background:rgba(217,97,90,.12)}
  .passiert{
    display:flex; gap:10px; align-items:baseline; padding:9px 13px; font-size:13px;
    background:var(--karte); border:1px solid var(--linie); border-radius:9px; color:var(--muted);
  }
  .passiert b{color:var(--text); font-weight:600}
  .passiert .wie{font-weight:700}
  .passiert .wie.freigegeben{color:var(--gruen)}
  .passiert .wie.abgelehnt{color:var(--rot)}
  .passiert .wie.geaendert{color:var(--gelb)}
  nav .zaehler.rot{background:var(--rot)}

  /* ----------------------------------------------------------------- Chat */
  #chat{flex-direction:column}
  .verlauf{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px}
  .tagtrenner{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; margin:6px 0}
  .tagtrenner:before,.tagtrenner:after{content:""; flex:1; height:1px; background:var(--linie)}
  .msg{display:flex; gap:12px; max-width:860px}
  .avatar{
    width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
    font-size:12px; font-weight:700; background:var(--gehoben); border:1px solid var(--linie);
  }
  .msg.ich .avatar{background:var(--akzent); border-color:var(--akzent); color:#fff}
  .msg.mensch .avatar{border-style:dashed}
  .msgkopf{display:flex; align-items:baseline; gap:9px; margin-bottom:3px; flex-wrap:wrap}
  .msgkopf .wer{font-weight:600}
  .msgkopf .meta{color:var(--muted); font-size:12px}
  .anhaenger{
    padding:1px 7px; border-radius:5px; background:var(--gehoben);
    border:1px solid var(--linie); font-size:11px; color:var(--muted);
  }
  .msgtext{white-space:pre-wrap; overflow-wrap:anywhere}
  .betreff{font-weight:600; margin-bottom:2px}

  .verfassen{
    flex:none; border-top:1px solid var(--linie); background:var(--karte); padding:12px 24px 16px;
  }
  .verfassen .zeile{display:flex; gap:10px; align-items:flex-end}
  .verfassen textarea{
    flex:1; min-height:46px; max-height:220px; resize:none; padding:12px 14px;
    background:var(--gehoben); border:1px solid var(--linie); border-radius:var(--radius);
  }
  .verfassen textarea:focus{outline:none; border-color:var(--akzent)}
  .empfaenger{
    background:var(--gehoben); border:1px solid var(--linie); border-radius:var(--radius);
    padding:12px 12px; max-width:210px;
  }
  .hinweiszeile{color:var(--muted); font-size:12px; margin-top:7px}

  /* ------------------------------------------------------------- Aufgaben */
  #aufgaben{flex-direction:column}
  .werkzeugleiste{
    flex:none; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--linie); background:var(--karte);
  }
  .spalten{flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:14px; padding:18px 24px}
  .spalte{flex:0 0 300px; display:flex; flex-direction:column; min-height:0}
  .spaltenkopf{
    display:flex; align-items:center; gap:9px; padding:0 4px 10px;
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  }
  .spaltenkopf .anzahl{color:var(--text); font-weight:700}
  .spalteninhalt{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:20px}
  .karte{
    background:var(--karte); border:1px solid var(--linie); border-radius:var(--radius);
    padding:13px 14px; cursor:pointer;
  }
  .karte:hover{border-color:var(--akzent); background:var(--gehoben)}
  .karte .titel{font-weight:600; margin-bottom:7px}
  .karte .fuss{display:flex; gap:7px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--muted)}
  .marker{width:3px; border-radius:3px; align-self:stretch}
  .karte{display:flex; gap:11px}
  .karte .inhalt{flex:1; min-width:0}
  .leer{color:var(--muted); font-size:13px; padding:14px 4px; font-style:italic}

  /* -------------------------------------------------------------- Wissen */
  #wissen{flex-direction:row}
  .notizliste{
    flex:0 0 230px; border-right:1px solid var(--linie); overflow-y:auto;
    padding:14px; display:flex; flex-direction:column; gap:5px; background:var(--karte);
  }
  .notizliste button{
    text-align:left; background:none; border:1px solid transparent; border-radius:8px;
    padding:8px 11px; cursor:pointer; color:var(--muted);
  }
  .notizliste button:hover{background:var(--gehoben); color:var(--text)}
  .notizliste button.aktiv{background:var(--gehoben); color:var(--text); border-color:var(--linie)}
  .notizinhalt{flex:1; overflow-y:auto; padding:24px; white-space:pre-wrap; overflow-wrap:anywhere}

  /* ------------------------------------------------------------ Bausteine */
  .knopf{
    background:var(--akzent); color:#fff; border:1px solid var(--akzent);
    border-radius:9px; padding:10px 17px; cursor:pointer; font-weight:600;
  }
  .knopf:hover{background:var(--akzent-hell); border-color:var(--akzent-hell)}
  .knopf:disabled{opacity:.5; cursor:default}
  .knopf.leise{background:var(--gehoben); border-color:var(--linie); color:var(--text); font-weight:500}
  .knopf.leise:hover{border-color:var(--akzent); background:var(--gehoben)}

  dialog{
    background:var(--karte); color:var(--text); border:1px solid var(--linie);
    border-radius:16px; padding:0; width:min(560px,92vw); box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  dialog::backdrop{background:rgba(4,10,20,.72)}
  .dlgkopf{padding:18px 22px 0; font-size:17px; font-weight:600}
  .dlgkoerper{padding:16px 22px; display:flex; flex-direction:column; gap:13px}
  .dlgfuss{display:flex; gap:10px; justify-content:flex-end; padding:0 22px 20px}
  label{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted)}
  label input,label textarea,label select{
    background:var(--gehoben); border:1px solid var(--linie); border-radius:9px;
    padding:10px 12px; color:var(--text);
  }
  label input:focus,label textarea:focus{outline:none; border-color:var(--akzent)}
  .kaestchen{display:flex; gap:16px; flex-wrap:wrap}
  .kaestchen label{flex-direction:row; align-items:center; gap:7px; color:var(--text); font-size:14px}

  .verlaufsliste{
    background:var(--bg); border:1px solid var(--linie); border-radius:9px;
    padding:11px 13px; font-size:12px; color:var(--muted); max-height:190px; overflow-y:auto;
    white-space:pre-wrap;
  }
  .statuswahl{display:flex; gap:7px; flex-wrap:wrap}

  footer{
    flex:none; display:flex; align-items:center; gap:14px; padding:7px 20px;
    background:var(--karte); border-top:1px solid var(--linie);
    font-size:12px; color:var(--muted);
  }
  footer .warn{color:var(--gelb)}
  footer .fehler{color:var(--rot)}
  footer .rechts{margin-left:auto; display:flex; gap:14px; align-items:center}
  .fluestern{color:var(--muted); font-size:12px}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:var(--linie); border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ------------------------------------------------- Handy (Stufe 4) */
  @media (max-width: 640px){
    header{padding:10px 12px; gap:10px}
    .praesenz .chip .wann{display:none}      /* Namen reichen, die Zeit frisst Platz */
    nav{padding:0 8px; overflow-x:auto}
    nav button{padding:11px 12px; white-space:nowrap}
    .heutefluss{padding:12px}
    .fzeile input{min-width:100%; order:9}   /* Kommentar unter die Knoepfe */
    .fvorschau{font-size:11.5px}
    .verlauf{padding:12px}
    .verfassen{padding:10px 12px 12px}
    .verfassen .zeile{flex-wrap:wrap}
    .empfaenger{max-width:none; flex:1 1 100%; order:-1; padding:9px 12px}
    .spalten{padding:12px; gap:10px}
    .spalte{flex:0 0 82vw}                   /* eine Spalte pro Bildschirm, seitlich wischen */
    .notizliste{flex:0 0 150px}
    .notizinhalt{padding:14px}
    footer{flex-wrap:wrap; gap:8px}
  }
</style>
</head>
<body>

<header>
  <div class="marke">sorgl<span class="punkt">.</span>OS <small>Team</small></div>
  <div class="praesenz" id="praesenz"></div>
</header>

<nav>
  <button data-blatt="heute" class="aktiv">Heute<span class="zaehler rot" id="zHeute" hidden></span></button>
  <button data-blatt="chat">Chat<span class="zaehler" id="zChat" hidden></span></button>
  <button data-blatt="aufgaben">Aufgaben<span class="zaehler" id="zAufgaben" hidden></span></button>
  <button data-blatt="wissen">Wissen</button>
</nav>

<main>
  <section class="blatt aktiv" id="heute">
    <div class="heutefluss" id="heutefluss"></div>
  </section>

  <section class="blatt" id="chat">
    <div class="verlauf" id="verlauf"></div>
    <div class="verfassen">
      <div class="zeile">
        <select class="empfaenger" id="empfaenger" title="An wen geht die Nachricht"></select>
        <textarea id="eingabe" rows="1" placeholder="An das Team schreiben…  (Enter sendet, Umschalt+Enter macht eine neue Zeile)"></textarea>
        <button class="knopf" id="senden">Senden</button>
      </div>
      <div class="hinweiszeile">
        Die Agenten sehen das beim nächsten <code>bus_sync</code> — nicht in Echtzeit.
      </div>
    </div>
  </section>

  <section class="blatt" id="aufgaben">
    <div class="werkzeugleiste">
      <button class="knopf" id="neuerAuftrag">Auftrag an alle drei</button>
      <button class="knopf leise" id="neueAufgabe">Einzelne Aufgabe</button>
      <span class="fluestern" id="aufgabenHinweis"></span>
    </div>
    <div class="spalten" id="spalten"></div>
  </section>

  <section class="blatt" id="wissen">
    <div class="notizliste" id="notizliste"></div>
    <div class="notizinhalt" id="notizinhalt"></div>
  </section>
</main>

<footer>
  <span id="ichbin"></span>
  <span class="rechts">
    <span id="syncstatus"></span>
    <button class="knopf leise" id="jetztSync" style="padding:4px 12px">Jetzt abgleichen</button>
  </span>
</footer>

<!-- ------------------------------------------------------------- Dialoge -->
<dialog id="dlgAuftrag">
  <div class="dlgkopf" id="dlgAuftragTitel">Auftrag an alle drei</div>
  <div class="dlgkoerper">
    <label>Titel
      <input id="aTitel" placeholder="z.B. Ideen für Kunde Nr. 1 sammeln" autocomplete="off">
    </label>
    <label>Was genau zu tun ist
      <textarea id="aBody" rows="5" placeholder="Kontext, Ziel, woran man merkt, dass es fertig ist."></textarea>
    </label>
    <div id="aWer">
      <div class="fluestern" style="margin-bottom:7px">Bearbeiter</div>
      <div class="kaestchen" id="aKaestchen"></div>
    </div>
    <div class="fluestern" id="aFehler" style="color:var(--rot)"></div>
  </div>
  <div class="dlgfuss">
    <button type="button" class="knopf leise" id="aAbbrechen">Abbrechen</button>
    <button type="button" class="knopf" id="aSenden">Anlegen</button>
  </div>
</dialog>

<dialog id="dlgAufgabe">
  <div class="dlgkopf" id="dTitel">Aufgabe</div>
  <div class="dlgkoerper">
    <div id="dMeta" class="fluestern"></div>
    <div id="dBody" style="white-space:pre-wrap"></div>
    <div>
      <div class="fluestern" style="margin-bottom:7px">Status setzen</div>
      <div class="statuswahl" id="dStatus"></div>
    </div>
    <label>Notiz an den Verlauf hängen
      <textarea id="dNotiz" rows="2" placeholder="optional"></textarea>
    </label>
    <div>
      <div class="fluestern" style="margin-bottom:7px">Verlauf</div>
      <div class="verlaufsliste" id="dVerlauf"></div>
    </div>
  </div>
  <div class="dlgfuss">
    <button class="knopf leise" id="dSchliessen">Schließen</button>
  </div>
</dialog>

<script>
"use strict";

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let ZUSTAND = null;
let offeneAufgabe = null;
let gelesenBis = Number(localStorage.getItem("gelesenBis") || 0);
let amEnde = true;

const STATUS = {
  open:        {label:"Offen",      farbe:"var(--linie)"},
  in_progress: {label:"In Arbeit",  farbe:"var(--akzent)"},
  blocked:     {label:"Blockiert",  farbe:"var(--rot)"},
  done:        {label:"Erledigt",   farbe:"var(--gruen)"},
  cancelled:   {label:"Verworfen",  farbe:"var(--muted)"},
};

const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function name(id){
  const t = ZUSTAND?.teilnehmer.find((x) => x.id === id);
  return t ? t.name : (id || "?");
}
function initialen(id){
  const n = name(id).replace(/^Claude\s*[—-]\s*/, "");
  return n.split(/\s+/).slice(0,2).map((w) => w[0] || "").join("").toUpperCase() || "?";
}
function istMensch(id){
  return ZUSTAND?.teilnehmer.find((x) => x.id === id)?.typ === "mensch";
}
function uhr(ts){
  if(!ts) return "";
  const d = new Date(ts.replace(/(\.\d+)?Z$/, "Z"));
  return d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
}
function tag(ts){
  const d = new Date(String(ts).replace(/(\.\d+)?Z$/, "Z"));
  const heute = new Date(), gestern = new Date(Date.now() - 864e5);
  const gleich = (a,b) => a.toDateString() === b.toDateString();
  if(gleich(d,heute)) return "Heute";
  if(gleich(d,gestern)) return "Gestern";
  return d.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
}

async function hole(pfad, koerper){
  const opt = koerper
    ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(koerper)}
    : {};
  const r = await fetch(pfad, opt);
  const d = await r.json().catch(() => ({fehler:"Antwort unlesbar"}));
  if(!r.ok) throw new Error(d.fehler || `HTTP ${r.status}`);
  return d;
}

// ------------------------------------------------------------------ Zeichnen

function zeichnePraesenz(){
  $("#praesenz").innerHTML = ZUSTAND.teilnehmer.map((t) => `
    <span class="chip ${t.aktiv ? "an" : ""} ${t.typ === "mensch" ? "mensch" : ""}"
          title="${esc(t.rolle)}">
      <span class="punktlicht"></span>${esc(t.name)}
      <span class="wann">${esc(t.zuletzt_text)}</span>
    </span>`).join("");
}

const STUFEN = {
  hoch:    "wirkt nach außen",
  mittel:  "gemeinsamer Stand",
  niedrig: "geringes Risiko",
};
const ENTSCHIEDEN = {
  freigegeben: "Freigegeben",
  abgelehnt:   "Abgelehnt",
  geaendert:   "Zurück zum Ändern",
};

function zeichneHeute(){
  const alle = ZUSTAND.freigaben || [];

  // Der Abgleich-Takt zeichnete diesen Bereich BISHER BEI JEDEM DURCHLAUF neu — auch wenn
  // sich an den Freigaben gar nichts geaendert hatte. Das kostete zweierlei: einen gerade
  // getippten Kommentar (das Eingabefeld wird mit ersetzt) und, wenn ein Klick genau in den
  // Austausch faellt, den Klick selbst — der Knopf ist dann samt seinem Listener schon aus
  // dem Dokument geloest. Deshalb hier nur noch anfassen, wenn wirklich etwas anders ist.
  const signatur = JSON.stringify(alle);
  if(signatur === zeichneHeute.letzteSignatur) return;
  zeichneHeute.letzteSignatur = signatur;

  const offen = alle.filter((v) => !v.entscheidung);
  const fertig = alle.filter((v) => v.entscheidung)
    .sort((a,b) => String(b.entscheidung.ts).localeCompare(String(a.entscheidung.ts)))
    .slice(0, 15);

  $("#heutefluss").innerHTML =
    `<div class="abschnittskopf">Wartet auf dich <span class="anzahl">${offen.length}</span></div>` +
    (offen.map((v) => {
      const stufe = STUFEN[v.stufe] ? v.stufe : "mittel";
      return `
      <div class="fkarte" data-id="${esc(v.id)}">
        <div class="fkopf">
          <span class="wer">${esc(name(v.by))}</span>
          <span class="meta">bittet um Freigabe · ${esc(tag(v.ts))} ${esc(uhr(v.ts))}${v.task ? " · Aufgabe " + esc(v.task) : ""}</span>
          <span class="stufe ${stufe}">${esc(STUFEN[stufe])}</span>
        </div>
        <div class="betreff">${esc(v.titel)}</div>
        ${v.warum ? `<div class="fwarum">${esc(v.warum)}</div>` : ""}
        ${v.vorschau ? `<pre class="fvorschau">${esc(v.vorschau)}</pre>` : ""}
        <div class="fzeile">
          <button class="knopf gruen" data-e="freigegeben">Freigeben</button>
          <button class="knopf leise" data-e="geaendert">Ändern lassen</button>
          <button class="knopf rot" data-e="abgelehnt">Ablehnen</button>
          <input placeholder="Kommentar — bei „Ändern lassen“ Pflicht" aria-label="Kommentar zur Entscheidung">
        </div>
      </div>`;
    }).join("") || `<div class="leer">Nichts wartet auf dich. Vorschläge reichen die Agenten mit <code>vorschlag_create</code> ein.</div>`) +
    `<div class="abschnittskopf" style="margin-top:14px">Was passiert ist</div>` +
    (fertig.map((v) => {
      const e = v.entscheidung;
      return `
      <div class="passiert">
        <span class="wie ${esc(e.entscheidung)}">${esc(ENTSCHIEDEN[e.entscheidung] || e.entscheidung)}</span>
        <span><b>${esc(v.titel)}</b> von ${esc(name(v.by))} — entschieden von ${esc(name(e.by))},
          ${esc(tag(e.ts))} ${esc(uhr(e.ts))}${e.kommentar ? " · „" + esc(e.kommentar) + "“" : ""}</span>
      </div>`;
    }).join("") || `<div class="leer">Noch keine Entscheidungen.</div>`);

  $$("#heutefluss .fkarte").forEach((k) => {
    const eingabe = k.querySelector("input");
    k.querySelectorAll("button[data-e]").forEach((b) => b.addEventListener("click", async () => {
      const kommentar = eingabe.value.trim();
      if(b.dataset.e === "geaendert" && !kommentar){
        eingabe.placeholder = "Was soll anders werden? Ohne Kommentar geht „Ändern lassen“ nicht.";
        eingabe.focus();
        return;
      }
      const knoepfe = [...k.querySelectorAll("button")];
      knoepfe.forEach((x) => x.disabled = true);
      try{
        await schreibe("/api/entscheidung",
                       {id: k.dataset.id, entscheidung: b.dataset.e, kommentar: kommentar || null});
      } finally {
        // Klemmt die Anfrage, meldet schreibe() das zwar per alert — die Karte blieb aber
        // fuer immer tot zurueck und sah damit aus wie erledigt, obwohl nichts entschieden
        // wurde. Beim naechsten Versuch muss sie wieder bedienbar sein. Ging die Anfrage
        // durch, ist diese Karte ohnehin gleich durch eine frisch gezeichnete ersetzt.
        knoepfe.forEach((x) => x.disabled = false);
      }
    }));
  });
}

function zeichneChat(){
  const v = $("#verlauf");
  amEnde = v.scrollHeight - v.scrollTop - v.clientHeight < 90;
  let letzterTag = null;
  v.innerHTML = ZUSTAND.nachrichten.map((m) => {
    let vorspann = "";
    const t = tag(m.ts);
    if(t !== letzterTag){ letzterTag = t; vorspann = `<div class="tagtrenner">${esc(t)}</div>`; }
    const anAlle = (m.to || []).includes("*");
    const ziel = anAlle ? "" : `<span class="anhaenger">an ${esc((m.to||[]).map(name).join(", "))}</span>`;
    // Betreffe, die nur der abgekuerzte Anfang des Textes sind, nicht doppelt zeigen.
    const kern = String(m.subject || "").replace(/…$/, "");
    const zeigeBetreff = kern && !String(m.body || "").startsWith(kern);
    return vorspann + `
      <div class="msg ${m.from === ZUSTAND.ich ? "ich" : ""} ${istMensch(m.from) ? "mensch" : ""}">
        <div class="avatar">${esc(initialen(m.from))}</div>
        <div>
          <div class="msgkopf">
            <span class="wer">${esc(name(m.from))}</span>
            <span class="meta">${esc(uhr(m.ts))}</span>${ziel}
          </div>
          ${zeigeBetreff ? `<div class="betreff">${esc(m.subject)}</div>` : ""}
          <div class="msgtext">${esc(m.body)}</div>
        </div>
      </div>`;
  }).join("") || `<div class="leer">Noch nichts gesagt. Schreib den ersten Satz — alle drei Accounts sehen ihn beim nächsten Abgleich.</div>`;
  if(amEnde) v.scrollTop = v.scrollHeight;

  const sel = $("#empfaenger");
  if(sel.dataset.stand !== String(ZUSTAND.teilnehmer.length)){
    sel.dataset.stand = String(ZUSTAND.teilnehmer.length);
    sel.innerHTML = `<option value="*">An alle</option>` + ZUSTAND.teilnehmer
      .filter((t) => t.id !== ZUSTAND.ich)
      .map((t) => `<option value="${esc(t.id)}">Nur ${esc(t.name)}</option>`).join("");
  }
}

function zeichneAufgaben(){
  const nach = (s) => ZUSTAND.aufgaben.filter((a) => a.status === s);
  $("#spalten").innerHTML = Object.entries(STATUS)
    .filter(([s]) => s !== "cancelled" || nach("cancelled").length)
    .map(([s, def]) => {
      const liste = nach(s);
      return `<div class="spalte">
        <div class="spaltenkopf">${esc(def.label)} <span class="anzahl">${liste.length}</span></div>
        <div class="spalteninhalt">${
          liste.map((a) => `
            <div class="karte" data-id="${esc(a.id)}">
              <div class="marker" style="background:${def.farbe}"></div>
              <div class="inhalt">
                <div class="titel">${esc(a.title)}</div>
                <div class="fuss">
                  <span>${a.owner ? esc(name(a.owner)) : (a.assign_to ? "→ " + esc(name(a.assign_to)) : "frei")}</span>
                  ${a.gruppe ? `<span class="anhaenger">Sammelauftrag</span>` : ""}
                </div>
              </div>
            </div>`).join("") || `<div class="leer">nichts</div>`
        }</div></div>`;
    }).join("");
  $$("#spalten .karte").forEach((k) =>
    k.addEventListener("click", () => zeigeAufgabe(k.dataset.id)));

  const offen = ZUSTAND.aufgaben.filter((a) => ["open","in_progress","blocked"].includes(a.status));
  $("#aufgabenHinweis").textContent = offen.length
    ? `${offen.length} offen — die Agenten holen sie sich mit task_claim.`
    : "Alles abgearbeitet.";
}

function zeichneWissen(){
  const l = $("#notizliste");
  const aktiv = l.querySelector("button.aktiv")?.dataset.key;
  l.innerHTML = ZUSTAND.notizen.map((k) =>
    `<button data-key="${esc(k)}" class="${k === aktiv ? "aktiv" : ""}">${esc(k)}</button>`
  ).join("") || `<div class="leer">Noch keine Notizen.</div>`;
  l.querySelectorAll("button").forEach((b) => b.addEventListener("click", async () => {
    l.querySelectorAll("button").forEach((x) => x.classList.remove("aktiv"));
    b.classList.add("aktiv");
    const d = await hole("/api/note/read", {key:b.dataset.key});
    $("#notizinhalt").textContent = d.text;
  }));
  if(!aktiv && !$("#notizinhalt").textContent){
    $("#notizinhalt").innerHTML = `<div class="leer">Links eine Notiz wählen. Notizen legen die Agenten mit <code>note_write</code> an — für Entscheidungen und Konventionen, die nicht im Chat wegscrollen sollen.</div>`;
  }
}

function zeichneFuss(){
  $("#ichbin").textContent = `Du bist ${name(ZUSTAND.ich)}`;
  const s = $("#syncstatus");
  if(!ZUSTAND.hat_remote){
    s.className = "warn";
    s.textContent = "Kein Git-Remote — nur lokal, die anderen sehen nichts";
  } else if(ZUSTAND.sync.fehler){
    s.className = "fehler";
    s.textContent = "Abgleich klemmt: " + ZUSTAND.sync.fehler;
  } else {
    s.className = "";
    s.textContent = "Abgeglichen " + (ZUSTAND.sync.letzter_sync ? uhr(ZUSTAND.sync.letzter_sync) : "—");
  }
}

function zeichneZaehler(){
  const neue = ZUSTAND.nachrichten.filter((m) =>
    m.from !== ZUSTAND.ich && new Date(String(m.ts).replace(/(\.\d+)?Z$/, "Z")).getTime() > gelesenBis).length;
  const z = $("#zChat");
  z.hidden = neue === 0 || $("nav button.aktiv").dataset.blatt === "chat";
  z.textContent = neue;

  const meine = ZUSTAND.aufgaben.filter((a) => ["open","in_progress","blocked"].includes(a.status)).length;
  const za = $("#zAufgaben");
  za.hidden = meine === 0;
  za.textContent = meine;

  const wartend = (ZUSTAND.freigaben || []).filter((v) => !v.entscheidung).length;
  const zh = $("#zHeute");
  zh.hidden = wartend === 0;
  zh.textContent = wartend;
  document.title = (wartend ? `(${wartend}) ` : "") + "sorgl.OS · Team";
}

function zeichne(){
  zeichnePraesenz(); zeichneHeute(); zeichneChat(); zeichneAufgaben(); zeichneWissen();
  zeichneFuss(); zeichneZaehler();
}

// ------------------------------------------------------------ Aufgaben-Dialog

function zeigeAufgabe(id){
  const a = ZUSTAND.aufgaben.find((x) => x.id === id);
  if(!a) return;
  offeneAufgabe = id;
  $("#dTitel").textContent = a.title;
  $("#dMeta").textContent =
    `${a.id} · angelegt von ${name(a.created_by)} · ` +
    (a.owner ? `bearbeitet von ${name(a.owner)}` : a.assign_to ? `vorgesehen für ${name(a.assign_to)}` : "niemandem zugewiesen") +
    (a.gruppe ? " · Teil eines Sammelauftrags" : "");
  $("#dBody").textContent = a.body || "(keine Beschreibung)";
  $("#dVerlauf").textContent = (a.verlauf || []).join("\n") || "(leer)";
  $("#dStatus").innerHTML = Object.entries(STATUS).map(([s, def]) =>
    `<button class="knopf ${s === a.status ? "" : "leise"}" data-status="${s}">${esc(def.label)}</button>`).join("");
  // Der Klick loest einen git-Weg aus (pull, schreiben, commit, push) und dauert damit RUND ZWEI
  // SEKUNDEN — gemessen am 05.08.2026: 32 ms fuer ein reines /api/state, 2398 ms fuer den
  // Schreibweg. Vorher gab der Knopf in dieser Zeit KEIN Zeichen: kein disabled, keine Beschriftung,
  // der Dialog blieb offen. Das sah nach „geht nicht" aus, und es wurde nachgeklickt — an einer
  // Aufgabe standen dadurch 16 Statuswechsel in 35 Sekunden im Verlauf, alle echt, alle unnoetig.
  // Jeder Klick schreibt eine Zeile, die niemand mehr loeschen kann. Deshalb: sofort sperren,
  // sichtbar melden, und erst danach schliessen.
  $$("#dStatus button").forEach((b) => b.addEventListener("click", async () => {
    const knoepfe = [...$$("#dStatus button")];
    const beschriftung = b.textContent;
    knoepfe.forEach((x) => x.disabled = true);
    b.textContent = beschriftung + " …";
    try{
      await schreibe("/api/task/update", {id:offeneAufgabe, status:b.dataset.status,
                                          note:$("#dNotiz").value.trim() || null});
      $("#dNotiz").value = "";
      $("#dlgAufgabe").close();
    } finally {
      // Klemmt der Weg, meldet schreibe() das per alert — der Dialog muss dann weiter bedienbar
      // sein, sonst steht er tot offen. Ging es durch, ist er ohnehin schon zu.
      b.textContent = beschriftung;
      knoepfe.forEach((x) => x.disabled = false);
    }
  }));
  $("#dlgAufgabe").showModal();
}

// ------------------------------------------------------------------ Schreiben

async function schreibe(pfad, koerper){
  try{
    await hole(pfad, koerper);
    await aktualisiere();
  }catch(e){
    alert("Hat nicht geklappt:\n\n" + e.message);
  }
}

async function aktualisiere(){
  try{
    ZUSTAND = await hole("/api/state");
    zeichne();
  }catch(e){
    $("#syncstatus").className = "fehler";
    $("#syncstatus").textContent = "Server nicht erreichbar";
  }
}

// -------------------------------------------------------------------- Bedienung

$$("nav button").forEach((b) => b.addEventListener("click", () => {
  $$("nav button").forEach((x) => x.classList.remove("aktiv"));
  b.classList.add("aktiv");
  $$(".blatt").forEach((s) => s.classList.toggle("aktiv", s.id === b.dataset.blatt));
  if(b.dataset.blatt === "chat"){
    gelesenBis = Date.now();
    localStorage.setItem("gelesenBis", String(gelesenBis));
    $("#zChat").hidden = true;
    $("#verlauf").scrollTop = $("#verlauf").scrollHeight;
  }
}));

const eingabe = $("#eingabe");
eingabe.addEventListener("input", () => {
  eingabe.style.height = "auto";
  eingabe.style.height = Math.min(eingabe.scrollHeight, 220) + "px";
});
eingabe.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sende(); }
});
$("#senden").addEventListener("click", sende);

async function sende(){
  const text = eingabe.value.trim();
  if(!text) return;
  const an = $("#empfaenger").value;
  $("#senden").disabled = true;
  eingabe.value = "";
  eingabe.style.height = "auto";
  await schreibe("/api/message", {to:[an], body:text});
  $("#senden").disabled = false;
  eingabe.focus();
}

let auftragModus = "alle";
$("#neuerAuftrag").addEventListener("click", () => oeffneAuftrag("alle"));
$("#neueAufgabe").addEventListener("click", () => oeffneAuftrag("einzeln"));

function oeffneAuftrag(modus){
  auftragModus = modus;
  const agenten = ZUSTAND.teilnehmer.filter((t) => t.typ === "agent");
  $("#dlgAuftragTitel").textContent = modus === "alle" ? "Auftrag an alle drei" : "Einzelne Aufgabe";
  $("#aKaestchen").innerHTML = agenten.map((t, i) => modus === "alle"
    ? `<label><input type="checkbox" value="${esc(t.id)}" checked> ${esc(t.name)}</label>`
    : `<label><input type="radio" name="wer" value="${esc(t.id)}" ${i===0?"checked":""}> ${esc(t.name)}</label>`
  ).join("");
  $("#aTitel").value = ""; $("#aBody").value = ""; $("#aFehler").textContent = "";
  $("#dlgAuftrag").showModal();
  setTimeout(() => $("#aTitel").focus(), 50);
}

$("#aAbbrechen").addEventListener("click", () => $("#dlgAuftrag").close());

// Bewusst ein eigener Klick-Handler statt des close-Ereignisses eines
// <form method="dialog">: das Ereignis kam in der Praxis nicht zuverlaessig an,
// und so laesst sich vor dem Schliessen pruefen.
$("#aSenden").addEventListener("click", async () => {
  const titel = $("#aTitel").value.trim();
  const gewaehlt = $$("#aKaestchen input:checked").map((i) => i.value);
  if(!titel){ $("#aFehler").textContent = "Ohne Titel geht es nicht."; return; }
  if(!gewaehlt.length){ $("#aFehler").textContent = "Niemand ausgewählt."; return; }

  const knopf = $("#aSenden");
  knopf.disabled = true; knopf.textContent = "lege an…";
  const body = $("#aBody").value.trim();
  try{
    if(auftragModus === "alle"){
      await hole("/api/auftrag", {title:titel, body, an:gewaehlt});
    } else {
      await hole("/api/task", {title:titel, body, assign_to:gewaehlt[0]});
    }
    $("#dlgAuftrag").close();
    await aktualisiere();
  }catch(e){
    $("#aFehler").textContent = "Hat nicht geklappt: " + e.message;
  }finally{
    knopf.disabled = false; knopf.textContent = "Anlegen";
  }
});

$("#dSchliessen").addEventListener("click", () => $("#dlgAufgabe").close());
$("#jetztSync").addEventListener("click", async (e) => {
  e.target.disabled = true;
  e.target.textContent = "läuft…";
  await schreibe("/api/sync", {});
  e.target.disabled = false;
  e.target.textContent = "Jetzt abgleichen";
});

aktualisiere();
setInterval(aktualisiere, 4000);
</script>
